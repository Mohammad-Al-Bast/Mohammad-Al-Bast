name: Update project graph

on:
  schedule:
    - cron: '17 * * * *' # hourly, at :17
  workflow_dispatch: # "Run workflow" button in the Actions tab
  repository_dispatch: # lets the portfolio CMS trigger a rebuild on publish later
    types: [projects-updated]
  push:
    paths:
      - 'scripts/build-graph.mjs'
      - 'data/projects.json'

permissions:
  contents: write
  actions: write # to keep the schedule enabled

concurrency:
  group: project-graph
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build graph from published projects
        run: node scripts/build-graph.mjs

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling it on every scheduled run keeps it alive even when projects don't change.
      - name: Keep schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/project-graph.yml/enable"

      - name: Commit if the graph changed
        run: |
          if git diff --quiet -- assets/project-graph.svg; then
            echo "No change in published projects."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-graph.svg
          git commit -m "chore: update project graph from mohammadalbast.com"
          git push
