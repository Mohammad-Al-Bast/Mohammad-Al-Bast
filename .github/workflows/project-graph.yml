name: Update project graph

on:
  schedule:
    - cron: '17 3 * * *' # nightly, 05:17 Beirut time
  workflow_dispatch: # "Run workflow" button in the Actions tab
  repository_dispatch: # lets the portfolio CMS trigger a rebuild on publish later
    types: [projects-updated]
  push:
    paths:
      - 'scripts/build-graph.mjs'
      - 'data/projects.json'

permissions:
  contents: write

concurrency:
  group: project-graph
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build graph from published projects
        run: node scripts/build-graph.mjs

      - name: Commit if the graph changed
        run: |
          if git diff --quiet -- assets/project-graph.svg; then
            echo "No change in published projects."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-graph.svg
          git commit -m "chore: update project graph from mohammadalbast.com"
          git push
